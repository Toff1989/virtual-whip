name: Idea or improvement
description: Suggest a feature, a new style, a setting...
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The need
      description: What problem do you want to solve, or what is missing for you?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: How do you imagine the solution? A mockup or an example setting helps a lot.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I can submit a pull request.
