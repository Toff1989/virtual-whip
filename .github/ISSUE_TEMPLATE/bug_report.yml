name: Bug
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. For a security vulnerability, do **not** open a public issue: see `SECURITY.md`.
  - type: textarea
    id: description
    attributes:
      label: What happens
      description: Describe the problem and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      placeholder: |
        1. Show the whip with Ctrl+Alt+F
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      description: Number shown in the extensions list, or in the name of the .vsix.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: vscode
    attributes:
      label: VS Code version
      description: Help → About.
      placeholder: "1.93.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2"
  - type: dropdown
    id: target
    attributes:
      label: Message destination involved
      options:
        - Claude Code terminal
        - Copilot chat
        - None (display, sound, mouse...)
        - I don't know
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: Copy the content of *View → Output → Virtual Whip* (the `[overlay]` and `[router]` lines).
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, changed settings, multiple screens...
