name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # The overlay is a Windows executable built with the system's csc.exe.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: package.json version follows VERSION.txt
        run: node scripts/sync-version.js --check

      - name: Build (TypeScript + native overlay)
        run: npm run compile

      - name: Tests
        run: npm test

      - name: Package the .vsix and the standalone installer
        run: npm run package

      - name: Archive the .vsix and the installer
        uses: actions/upload-artifact@v4
        with:
          name: virtual-whip
          path: |
            *.vsix
            install-virtual-whip.bat
          if-no-files-found: error
