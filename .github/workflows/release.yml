name: Release

# To publish a version: edit VERSION.txt, update CHANGELOG.md, commit, then
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: The tag must match VERSION.txt
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION.txt | sed 's/^\xEF\xBB\xBF//')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "The tag ${GITHUB_REF_NAME} does not match VERSION.txt (v${version})." >&2
            exit 1
          fi

      - run: npm test

      - name: Package the .vsix and the standalone installer
        run: npm run package

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.vsix
            install-virtual-whip.bat
