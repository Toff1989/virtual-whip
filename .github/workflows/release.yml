name: Release

# To publish a version: edit VERSION.txt, update CHANGELOG.md, commit, then
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # For the build attestation (see the "Attest" step)
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: The tag must match VERSION.txt
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION.txt | sed 's/^\xEF\xBB\xBF//')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "The tag ${GITHUB_REF_NAME} does not match VERSION.txt (v${version})." >&2
            exit 1
          fi

      - run: npm test

      - name: Package the .vsix, the standalone installer and the checksums
        run: npm run package

      # The overlay is an unsigned executable: this lets a download be traced back to this run
      # (gh attestation verify <file> --repo Toff1989/virtual-whip).
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            *.vsix
            install-virtual-whip.bat

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.vsix
            install-virtual-whip.bat
            SHA256SUMS.txt
